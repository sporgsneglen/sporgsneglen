<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Spørg Sneglen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 60%;
      padding: 15px;
      font-size: 1.2rem;
      border-radius: 10px;
      border: 2px solid #ccc;
      text-align: center;
    }

    #result {
      margin-top: 40px;
      font-size: 2rem;
      font-weight: bold;
    }

    .dice {
      font-size: 3rem;
      display: block;
      margin-top: 10px;
    }

    /* Snegl stort billede */
    .snegl-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      transition: transform 0.2s ease;
    }

    .snegl-container.shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      20% { transform: translate(-5px, 0px) rotate(-10deg); }
      40% { transform: translate(5px, 0px) rotate(10deg); }
      60% { transform: translate(-5px, 0px) rotate(-10deg); }
      80% { transform: translate(5px, 0px) rotate(10deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    .snegl-container img {
      width: 300px; /* Stort billede */
      height: auto;
      margin-bottom: 10px;
    }

    .snegl-container span {
      font-size: 2rem;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      input[type="text"] {
        width: 80%;
        font-size: 1rem;
        padding: 10px;
      }
      .snegl-container img {
        width: 200px;
      }
      .snegl-container span {
        font-size: 1.5rem;
      }
      .dice {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Snegl vises stort øverst -->
  <div class="snegl-container" id="sneglContainer">
    <img src="snegl.jpg" alt="Sneglen" />
    <span>Sneglen</span>
  </div>

  <h1>Spørg Sneglen 🐌</h1>
  <p>Skriv dit JA/NEJ-spørgsmål og tryk Enter!</p>

  <!-- Inputfelt til spørgsmål -->
  <input type="text" id="questionInput" placeholder="Skriv dit spørgsmål her..." />

  <div id="result"></div>

  <script>
    const diceFaces = ["JA", "NEJ", "MÅSKE"];
    const input = document.getElementById("questionInput");
    const result = document.getElementById("result");
    const sneglContainer = document.getElementById("sneglContainer");

    input.addEventListener("keypress", function(event) {
      if (event.key === "Enter" && input.value.trim() !== "") {
        // Tilføj shake animation til sneglen
        sneglContainer.classList.add("shake");
        setTimeout(() => {
          sneglContainer.classList.remove("shake");
        }, 500);

        // Vælg tilfældigt svar
        const random = Math.floor(Math.random() * diceFaces.length);
        const answer = diceFaces[random];

        // Vis svaret som "Sneglen siger ..."
        result.innerHTML = "<span class='dice'>Sneglen siger " + answer + "</span>";

        // Ryd inputfelt
        input.value = "";
      }
    });
  </script>
</body>
</html>
