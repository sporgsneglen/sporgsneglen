<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Spørg Sneglen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    button {
      background-color: red;
      border: none;
      color: white;
      padding: 20px 40px;
      font-size: 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
    }

    #result {
      margin-top: 40px;
      font-size: 2rem;
      font-weight: bold;
    }

    .dice {
      font-size: 5rem;
    }
  </style>
</head>
<body>
  <h1>Spørg Sneglen 🐌</h1>
  <p>Tænk på et JA/NEJ-spørgsmål – og tryk på knappen!</p>
  <button onclick="rollDice()">Tryk her</button>

  <div id="result"></div>

  <script>
    function rollDice() {
      const diceFaces = [
        "1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣", "🐌"
      ];
      const random = Math.floor(Math.random() * diceFaces.length);
      document.getElementById("result").innerHTML = 
        "Terningen siger: <span class='dice'>" + diceFaces[random] + "</span>";
    }
  </script>
</body>
</html>
